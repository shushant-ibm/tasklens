name: Concurrency & Stress Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  jvm-benchmarks:
    name: KMP Concurrency Stress (1M increments)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP Sequence Counter Stress Test
        run: ./gradlew :tasklens-core-kmp:jvmTest --tests "dev.shushant.tasklens.core.SequenceCounterStressTest" --stacktrace

  ios-benchmarks:
    name: Swift Concurrency Stress (100k increments)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift High-Concurrency Sequence Tests
        run: swift test --filter TaskLensConcurrencyTests
