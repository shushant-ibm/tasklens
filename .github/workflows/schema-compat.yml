name: Schema & Archive Compatibility

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  schema-compat:
    name: Schema & Archive Contract Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Schema Compatibility & Parity Tests
        run: ./gradlew :tasklens-core:test :tasklens-export:test --tests "*Parity*" --tests "*Export*" --stacktrace

      - name: Verify Cross-Platform Archive Golden Fixtures
        run: ./gradlew :tasklens-export:test --tests "dev.shushant.tasklens.export.CrossPlatformArchiveParityTest" --stacktrace
