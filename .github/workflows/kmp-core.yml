name: KMP Core

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-jvm:
    name: Build & Test (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build KMP core & run JVM tests
        run: ./gradlew :tasklens-core-kmp:build :tasklens-core-kmp:jvmTest -PskipSamples --no-daemon

      - name: Run tasklens-core tests (parity + existing)
        run: ./gradlew :tasklens-core:test -PskipSamples --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  build-ios:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run KMP iOS Simulator Tests
        run: ./gradlew :tasklens-core-kmp:iosSimulatorArm64Test -PskipSamples --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ios
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
